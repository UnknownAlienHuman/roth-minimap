name: Validate design refinement

on:
  push:
    branches: [design/obsidian-ember-refinement]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
      - name: Compile every Lua file
        run: lua5.1 tests/test_syntax.lua
      - name: Static contracts
        run: lua5.1 tests/test_contracts_12_1_5.lua
      - name: Offline runtime contracts
        run: lua5.1 tests/test_runtime_stubs.lua
      - name: Validate TGA media
        run: python3 tests/test_media.py
